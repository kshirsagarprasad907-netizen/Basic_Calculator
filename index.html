<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <img src="./assets/images/catCalculator.jpg" alt="a crying cat doing math" class="mainImage">
    <h1>Calculate Stuff here</h1>
    <p>just type in numbers and see the answer! (but calculate again using a real calulator because this might not work)</p>
    <div id="calForm">
        <input type="number" id="num1" placeholder="Put first number here" required>
        <input type="number" id="num2" placeholder="Duh, put second number here" required>
        <button type="button" id="addBtn">Add</button>
        <button type="button" id="subtractBtn">Subtract</button>
        <button type="button" id="multiplyBtn">Multiply</button>
        <button type="button" id="divideBtn">Divide</button>
        <p id="result" placeholder="Result will appear here"></p>
    </div>
    <script src="./src/script.js"></script>
</body>
</html>
