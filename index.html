<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="titleContent">
    <img src="./assets/images/catCalculator.jpg" alt="a crying cat doing math" class="mainImage">
    <div id="titleText">
    <h1>Calculate Stuff here</h1>
    <p>maybe calculate again using a real calculator too, cause god knows if this will work</p>
    </div>
    </div>
    <div id="calForm">
        <div class="inputContainer">
            <div class="inputBoxes">
        <input type="number" id="num1" placeholder="Put first number here" required>
        <input type="number" id="num2" placeholder="Duh, put second number here" required>
        </div>
        <h2 id="result" placeholder="Result will appear here"></h2>
        </div>
        <h2>Choose an operation below:</h2>
        <button type="button" id="addBtn">
            <img class="btnImg" src="/assets/images/addBtn.png" alt="add button" class="buttonImage">
        </button>
        <button type="button" id="subtractBtn">
            <img class="btnImg" src="/assets/images/subtBtn.png" alt="subtract button" class="buttonImage">
        </button>
        <button type="button" id="multiplyBtn">
            <img class="btnImg" src="/assets/images/multBtn.png" alt="multiply button" class="buttonImage">
        </button>
        <button type="button" id="divideBtn">
            <img class="btnImg" src="/assets/images/divBtn.png" alt="divide button" class="buttonImage">
        </button>
        <p>if you are too dumb to understand, look at the signs these cats hold</p>
    </div>
    <script src="./src/script.js"></script>
</body>
</html>
